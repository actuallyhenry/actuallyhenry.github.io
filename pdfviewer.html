<a
  href="#"
  onclick="handleClick(this)"
  data-url="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Tabancale_language_map.png/250px-Tabancale_language_map.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail">Click Me</a>

<embed
  id="viewer"
  src=""
  type="application/pdf"
  frameBorder="0"
  scrolling="auto"
  height="800px"
  width="100%"></embed>

<script>
  const handleClick = (target) => {
    const cwd = window.location.href.substring(0, window.location.href.lastIndexOf("/"));
    document.getElementById("viewer").src = `${cwd}/${target.dataset.url}`
  }
</script>
